# RF-DETR configuration - same fields as default.yaml, different model.
# model:
#   - src/detect.py (baseline): "rfdetr-<size>" with size in nano/small/medium/base/large
#     (weights auto-download on first run), or "rfdetr-<size>:path/to/weights.pth"
#     for custom-trained weights.
#   - scripts/infer_rfdetr_trt.py (optimized): a TensorRT .engine built by
#     scripts/export_rfdetr.py - pass it with --engine (this field is then ignored).
model: rfdetr-nano # closest counterpart to yolov8n
source: data/vtest.avi # v1b: local file. For v1a, set an rtsp:// URL (or pass --source)
conf: 0.25 # confidence threshold (same as the YOLO runs, for a like-for-like comparison)
imgsz: 640 # ignored for RF-DETR: input resolution is fixed by the model size (nano = 384)
display: true # show the annotated window on the Jetson's monitor
max_frames: 0 # 0 = run to end of source; set e.g. 600 to cap a profiling run
warmup_frames: 0 # frames to exclude from the FPS timer (CUDA/TensorRT warm-up)
